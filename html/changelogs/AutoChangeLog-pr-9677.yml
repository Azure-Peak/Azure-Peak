author: "WeNeedMorePhoron"
delete-after: True
changes:
  - rscadd: "Removed blockade surcharge as a feature completely."
  - rscadd: "Unified blacksmithing and normal crafting quality formula. Legendary once again guarantee Masterwork as intended etc."
  - rscadd: "Disabling withdrawal no longer prevent direct import at the stockpile."
  - rscadd: "Merchant and Shophand can now issue contrats with ATC money. They pay 1.5x more to reflect their stronger financial power."
  - rscadd: "Added a leashing mechanic to kill quest to teleport NPC that stray too far and is out of sight. may or may not work"
  - rscadd: "Parcel will now only appears after you have killed all of the guardians on a recovery quest. Also fixed an issue that might've caused it to spawn 2x the strongboxes / people"
  - rscadd: "Restored masterwork quality polishing which was removed by accident in Econ 3"
  - rscadd: "Increased threat points of certain skeletons because it appears too many are spawning. For some reason medium skeleton was costing less than easy (!). Archer cost also increased."
  - bugfix: "Fixes issues where a stockpile purchase and various other flows were misattributed as \"Unauthorized Withdrawal\" in the economic chronicle"
  - bugfix: "Fixes issues with some roles (mainly church roles and then veteran) still taking money from the treasury account instead of minting it anew on account creation and then counting as \"Unauthorized Withdrawal\""
  - rscadd: "Implemented fellowship based rewards and threat scaling. Every type of contracts that is not a towner contract or notorious contract will now scales up the amount of enemies and rewards based on your fellowship size beyond its minimum requirements. This is multiplicative with eachother but not itself. Easy contracts scales +50% threat / head, medium 33%, hard 25% / head. And then each extra person gives a +20% multiplier to rewards. Therefor, for example at a 6 fellowship with easy contract designed for 1 person you will get +200% more threat (250% the goblins), and then get 500% the original rewards since it is a multiplicative +100%. This is (blatantly gamey) and intended to make up for the friction of gathering a larger group and splitting the rewards between you all."
  - rscadd: "Blockade scaling was also reimplemented. Previously, it was +20% threat and +20% Reward. Now, the scaling is +10% threat, but +33% rewards, to encourage you to bring more people for more rewards. This is done because of my observations that without very trustworthy and well equipped players our players will generally struggle to handle blockade and it led to people avoiding randoms like they're playing competitive MMO. I don't want that. Blockade was meant to be the no.1 way for you to meet new friends and not pick your competitive league team"
  - rscadd: "Implemented Incursion contract, which requires a fellowship of 3 person, and is a two wave contract with more rewards. It costs 250 pledge and 8 rumor points to issue and will spawn naturally"
  - rscadd: "Fellowship scaling will be indicated clearly in UI and in writ"
  - rscadd: "Added local debug to allow you to forcibly invite someone into your fellowship for testing purpose"
  - bugfix: "You cannot take a blockade writ without a bank account anymore"
  - rscadd: "Quest Debug Panel now defaults to active contracts instead of open contracts"
  - rscadd: "Implemented fellowship rewards splitting, shown in fellowship UI. On SIGNING UP FOR A CONTRACT, it will inherit your fellowship's reward splitting mode. Rewards will be split after contract evenly between every single members of your fellowship with a bank account, with anyone who don't have a bank account's leftover given to the person who turns it in."
  - balance: "Standing order base bonus is now 1.5x instead of 1.0"
  - rscadd: "Latejoiners are immune to poll levy for 30 minutes after joining"
  - rscadd: "Merchant can send for a single ship a day for 250 Favor from a specific realm"
  - balance: "Reduced rewards of easy / medium soloable mission a bit"
  - balance: "Reduced flat payout a bit"
  - balance: "Reduced payout multiplier on Terrorbog, increased them on Coast and Decap"