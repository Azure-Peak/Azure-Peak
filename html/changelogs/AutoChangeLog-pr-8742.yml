author: "Quinalion"
delete-after: True
changes:
  - sound: "Added a recorking sound for glass bottles and alchemical vials."
  - qol: "Glass bottles can now be opened and closed through several additional interaction methods."
  - qol: "Bottles now warn you when being stored while uncorked."
  - bugfix: "Liquid transfer interactions now properly report when one or both containers are closed."
  - bugfix: "Open containers in your inventory now warn you when they spill due to movement."
  - bugfix: "Putting a bottle into a bag no longer incorrectly displays \"The bottle won't fit in there.\"."
  - code_imp: "Standardized anti-spilling behavior for storage items using the does_not_spill variable."