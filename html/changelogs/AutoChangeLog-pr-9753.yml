author: "radarseas"
delete-after: True
changes:
  - rscadd: "Added new examine texts + deadite reanimation flavor when standing up again, this includes animals!"
  - rscadd: "Non-murkling deadites now bleed black blood!"
  - rscadd: "Zombies have more varience when they try to speak anything but Zizocant."
  - rscadd: "More zombie racial examine obfusications"
  - rscadd: "Lich/Skeleton races are now obfuscated to everyone else, you can only see an ancient corpse, not whatever they were in life."
  - rscadd: "Added SEEK THE LYVING, a spell zombies get to put their ability to track people on their UI, it also has a cooldown so you can't just spam a check every humen off-the-list constantly."
  - rscdel: "Removed zombie seek verb, it was old and janky as fuck man."
  - qol: "zombies get less text spam + clearer text on spawning in to what you're supposed to do"
  - qol: "using items you're not meant to as a zombie drops them so you don't fumble too hard if people throw stuff on the floor."
  - balance: "Zombie seek verb now tracks actual players you can infect, not random NPCs"
  - balance: "Zombies can't even tell origins anymore, you are actively rotting away."
  - balance: "Deadite grace 3 minutes -> 2 minutes."
  - balance: "Skeletons can now see other races without it being obfusicated"
  - bugfix: "skeletons are now zombie_immune so they don't clog deadites up with false information about having to attack them."
  - bugfix: "zombie seek verb now respects zombie immune people and doesn't track NPCs anymore."
  - bugfix: "zombie antag datum and manic (if it ever gets granted) no longer obfuscate examines in dchat. This means you're no longer unable to tell anyone's race while dead and watching as a ghost."
  - image: "re-used old zizoblind into zombie_spells, a new file if you want to give zombies abilities they can use. Think faking death and hiding their examine for ambushes, regenerating rapidly by standing still, etc, etc. Its currently only used for seeking people out."
  - refactor: "Zombie Seek - Verb -> Spell"