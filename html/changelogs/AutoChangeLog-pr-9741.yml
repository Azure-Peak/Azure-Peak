author: "WeNeedMorePhoron"
delete-after: True
changes:
  - rscadd: "Removed npc_simple_mob_modifier, and replaced it with an anti_beast_factor. I was never comfortable with the idea of something only applying to !mind mob. Anti_beast_factor multiplies damage vs ALL SIMPLE ANIMALS, cliented or not."
  - rscadd: "Arrows now inherit a 1.5x antibeast modifier instead of 1.0x, making their damage nearly the same as pre nerf"
  - rscadd: "Anti-Beast modifier now applies to part damage vs simple animals, previously it only used the base damage (Bug, discovered while testing)"
  - rscadd: "Hunter gain leather pants instead of tights, so they have a bit more protection"
  - rscadd: "Hunter and Huntmaster gain Monster Hunter trait. This trait grants +20 flat accuracy bonus in melee and ranged attacks vs simple animals, 1.5x part damage multiplier in melee, and turns ranged part damage from 0.66x to 1.0x from ranged weapons"
  - rscadd: "Hunter lost Hunter's Yell, replaced with Run For It"
  - bugfix: "It turns out that for nearly 90% of all simple mobs, part breaking was not working for ranged weapons / ranged attacks. This has been fixed."
  - rscadd: "Implemented the **Run For It** ability, based on Hunter's Yell. It has a 3 minutes cooldown and reset all complex mobs aggro. It gives you a movespeed modifier about equal to a +4 SPD bonus, lasts for 10 seconds, and hit you with -4 Str, Int AND Perception. It is canceled by most attack, spellcasting actions, or being attacked by a complex minded mob. And it grants you temporary immunity to kneestingers and ambushes and maneater while it is active. It is meant as a defensive ability to get you out of an ambush or a bad PVE situation, and can be situationally useful for weaseling out of a PVP situation."
  - rscadd: "Run For It is given to all towners that conceivably have reasons to go out into the wild and may encounter PVE they cannot handle currently. This list includes: Hunters (both), Woodworker, Fisher (Master Fisher)"