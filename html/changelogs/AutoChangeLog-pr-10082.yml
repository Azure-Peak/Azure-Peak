author: "WeNeedMorePhoron"
delete-after: True
changes:
  - bugfix: "NPC now have an imitated reaction time and delay and chance to miss their toss, just like a player"
  - bugfix: "NPC should no longer beat themselves to death trying to clear an obstacle on the same tile, which just so happens to be themselves"
  - bugfix: "You can no longer kick yourself"
  - rscadd: "After closing into melee with an archer NPC, they will commit to melee for a bit before trying to kite and shoot again"
  - rscadd: "NPC archers shoot faster again"
  - rscadd: "Mage NPCs are more likely to miss and now have 1 level less of staff to make them easier to kill."
  - rscadd: "NPC with skills at Journeyman level or below will now aim for major zones instead of subzones. This includes somewhere between 40% of deadites to 70% of goblins, 50 - 60% of orc / reavers / bandits"
  - rscadd: "Skeletons threat points is adjusted up and down to corresponds to the actual amount of threat and armor they have."
  - balance: "Ironified bog deserters and dwarf skeleton knight gears"
  - rscadd: "Adjusted NPC tracking on Pyro / Ferra / Spellblades to be fairer"
  - rscadd: "NPC spells and bow draw can no longer be interrupted by hitting them, same as a player's"