author: "radarseas"
delete-after: True
changes:
  - rscadd: "Added proper mechanics to show who you listen to in chat for vampire converts"
  - balance: "Vampire lord pre-emptively has stage 1 ascension benefits (grab immunity + 1000 vitae -> 4000 vitae extra over regular vampires +4 to all stats vs +2 beforehand. to make them feel less compelled to rush power. + can buy champions w/out grind for rituals.)"
  - balance: "regular vampire servants cost less now."
  - balance: "Vampire lord is now Godless instead of a Zizo worshipper. Making the first and only exception currently to a true godless antag role."
  - balance: "Vampire lord only has to do 3 rites to ascend instead of 4. Less grind, more roleplaying leeway."
  - balance: "turning into a vampire via conversion stuns you for 15 less seconds, but knocks you out instead."
  - qol: "vamp has a lot of tuneups over-the-board"
  - balance: "other clan trait adjustments that aren't mentioned here."
  - balance: "Dying gasps can only be heard if you're close enough to reasonably see it happen."
  - bugfix: "Dying gasps bypassing walls/z levels an entire screen away. They're only audiable up close/with LOS."
  - balance: "vamp clans can ALL burn under sunlight without disguise. They use different levels of vitae drains + damages in turn."
  - balance: "vamp clans have recieved a shift-around in traits, Thronleer is no longer bad mood cursed but instead sunlight scorned, its only the only clan w/ fae potency now nosferato lost it ages ago."
  - image: "added re-palettes of pre-existing sprites for vamp hud stuff"
  - refactor: "made it clearer on sun hater component that the values are set on init instead of lying above."
  - refactor: "vagabond thrall now uses its generation instead of making Stray as a job. Masquerade/vlord bypass this by generation checks."
  - admin: "Vlord RRing punishment is logged correctly."
  - admin: "vagabonds/wretches at Neonate or Lower in vampire generation, will be forced to cattiff clans. Code-Related Restriction unfortunately for now."