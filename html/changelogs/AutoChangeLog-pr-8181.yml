author: "WeNeedMorePhoron"
delete-after: True
changes:
  - balance: "Vampire no longer get a +4 fatigue regen while standing that is counteracted by not having Bready in combat, giving them +2 Energy mid combat and +4 passively outside. This seems to be causing a lot of balance issues in general since they are able to ignore a lot of blue management. The current blue management is primarily done by laying down near campfire and just laying down. Vampire should not be able to dodge this constraint on battle endurance."
  - balance: "Vampire no longer gain a stacked +10 regen from laying down alongside nosleep's +5, giving them +15 blue regen when laying down, before accounting for campfire / blanket"
  - balance: "Vampires no longer benefit from lesser miracles heal (Indicator stays to prevent metacheck)"
  - balance: "Added pseudo aspects to various spellblade, bard, vizier, hierophant, berserker etc. spell"
  - balance: "Using a non-bloodheal vampiric power will **lock you out of using mage and above class specific spells for 1 minute** with a new status effect called Vitae Surge"
  - balance: "Dreamwalker, no matter what, cannot use miracles or spells even if they somehow gain it"
  - balance: "Vampires can no longer use miracles above T1, others are preserved for the sake of disguise and completely neutering the class. The gods does not answer, sire."
  - admin: "The give spell verb in vv is now routed to the new form in loadout manager."