author: "Ketrai"
delete-after: True
changes:
  - qol: "Revival spells now display their casting costs on examine."
  - qol: "Canister racks now indicate on examine if there is a research penalty due to broken canisters, or if the crystal is fully attuned."
  - qol: "Unlocking certain heartbeast research nodes now notifies relevant casters (healing, revival)."
  - qol: "Black rot aura can be toggled with a verb now. Blocks spell use when toggled off."
  - rscadd: "Cure rot can give devotee+ pestrans the pestran bed miracle when the black rose is researched."
  - balance: "Pestilent Blade now deals less armor piercing damage to minded targets, and reduces strength by -2 instead of -3. Deals more damage to mindless targets."
  - balance: "Infestation now deals more brute damage, but no tox damage to minded targets."
  - bugfix: "Prevented bed creating spells from placing multiple beds on a single tile."
  - refactor: "Refactored Eora bed code for better target acquisition."