author: "radarseas"
delete-after: True
changes:
  - rscadd: "VL now gets a full keyring on spawn instead of just one key."
  - balance: "VL can no longer roll jobs on top of their own gear-set. No more mage associate or spellblade VLs w/ 20 int + mending."
  - balance: "VL now starts w/ guarded virtue for free and no longer has a forced lord/lady title. This should make it harder to metagame smart vampire lords trying to blend in and roleplay instead of fragging out."
  - balance: "VL has bad trainer trait, no more accidentally training your enemies or allies to master."
  - balance: "VL now has bad trainer, no more levelling your victims/allies with master weaponry skill."
  - balance: "VL's roundstart tights are now armored so you have something for the legs."
  - balance: "master rod no longer works on dreamwalkers, VL and lich"
  - bugfix: "you no longer keep keys/houndstones on you from your job when spawning as a roundstart bandit, or as a lich/VL."
  - bugfix: "lich no longer starts w/ known people, they have to examine people."
  - balance: "VL's statline is now normalised to 14, no matter what class you take."
  - bugfix: "roundstart bandits no longer stack job on top of bandit class, spell wise and stuff. I know there's a few edge cases, don't exploit them. I can't fix them yet."
  - bugfix: "lich now properly gets their chalk on revival, it was trying to be assigned before we equipped the new body, whoops!"
  - admin: "forced vampires gamemode is now just named vampire lord, to be far less deceiving."
  - balance: "VL now gets a decorated dagger, lich now gets a blacksteel dagger instead of steel + grand tome on hip at the price of losing their mana potion (you couldn't use it anyway lol)"