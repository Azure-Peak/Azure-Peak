author: "radarseas"
delete-after: True
changes:
  - rscadd: "Added new miracles for Zizo."
  - rscadd: "tweaked various descriptions and such involving certain Zizite items."
  - rscadd: "rejection from rituos is slightly tuned up and a little bit more flashier"
  - rscadd: "Zizo rituals are flashier and snuff out the lighting once completed successfully."
  - rscadd: "Added two more rituals to Zizo, \"Progressive Trance\" and \"Insightful Chant\"."
  - rscadd: "Added a contraband bible, exclusive intentionally to Zizite heretics and Zpellblades (not unbound)."
  - rscadd: "Zizo's patron has changed confession lines + vague description tweaks to better fit with the lore. Instead of ZIZO for the sake of Zizo. She's properly the lady of Artifice, Undeath, Progress and Left-handed Magicks."
  - rscdel: "Armament rites no longer give you a round long -2 debuff to all stats when done on another, you already have a 2hr long unique-cooldown as-is that prevents you mass-distributing it."
  - balance: "armament rite extended cooldowns now apply to Gnolls/Spies as well as regular heretics. I know what you are."
  - balance: "Zeretic statline has been shuffled over to +1 WIL, +1 INT +1 PER from +1 per/str/con, since burns are less of an applicable factor + its a spellcaster hybrid that gets shadowed by Noc since rituos no longer grants majors."
  - rscadd: "Added a fuckhuge of new sprites/respites for Zizo-related left-handed magicks or sprite-shifts to make it clearer that its unholy magicka."
  - balance: "Zizo's miracles are slightly different now on-average."
  - balance: "any inhumen cross can be used for interrogations."
  - balance: "unknightly migrant wave has Zizocant now."
  - balance: "heretics get iron zcrosses vs decrepit, not it means much."
  - balance: "necromancer now has diagnose (overdue tbh) this version is 7 tiles vs 4. Lich gets this version instead too."
  - image: "added/modified around some sprites, for necromancers and w/ever"