author: "radarseas"
delete-after: True
changes:
  - rscadd: "added more variance in styles for missionaries + acolytes + psydonite cantors + druids"
  - balance: "Necrans missionaries/acolytes now spawn with winding wraps in their satchel for transporting bodies rapidly."
  - balance: "Druids have recieved a slight miracle level buff (this doesn't really do anything for them)"
  - balance: "Druids have slightly higher non-unarmed skills to fight NPCs better with, so they don't die to a skeleton parrying their whip 20 times over, moreso since they lost kneestingers."
  - balance: "Missionary advs + Clergy acolytes + Druids now spawn with some basic medical supplies to do their job, missionaries notably get better needles, this is intended as you're out in the field, acolytes have better tools in their dedicated facilities. Druids aren't healers."
  - balance: "Martyr/Monks/Guardians/Templar/Church Spellblades now spawn with chains in their satchel so they can immediately do their job instead of killing people first, chains later."
  - balance: "Xylixian missionaries no longer get luck charms, instead they get a Patron-Fitting Psicross like everyone else."
  - balance: "Acolytes get apprentice climbing just like missionaries so you can prop a chair up against a wall to climb."
  - balance: "Missionary adventurers get Journeyman medical to put them above Paladin on a Clerical Oath, this should make them more distinctive as a class."
  - balance: "Malumite Acolyte gets a wood-cutting axe off-the bat to give them a bit of patron-distinctive gear, you can still summon gear or melt it down into an anvil but its useful."
  - balance: "Paladins can now pick an arming sword as a weapon choice, which is in most cases better for PVE anyway due to mobs lacking a crit theshold and because it has higher accuracy."
  - balance: "Paladins can't pick between fluted cuirass and haulberk without being to be Psydonites."
  - balance: "Painters and the Abyssorian cult got a minor tuneup in style asimilar to clergymen."
  - balance: "Graggar/Zizo missionaries have a \"unique\" outfits for now. other ascendants may come later."