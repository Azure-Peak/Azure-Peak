2026-10-06:
  KatTheFox:
  - rscadd: The INDEXER report no longer gaslights you with a fake false positive
      chance. Instead, it actually does have a false positive chance now. This works
      generally how you'd expect - and in some cases the chance can be increased,
      like anyone pallid or who's been bitten by a vampire having a chance to be flagged
      AS a vamp. The false positive chance for patron type is lower than what it says
      unless you've ever been affected by a miracle of the Four.
  - rscadd: Clerics of the Ten or Four who convert to Psydon no longer have their
      devotion entirely deleted. They instead get reset to devotee level, meaning
      they get Orison and Bootcheck only. No real miracles still.
  Ollanius:
  - qol: Katzbelgers(?) (sorry Spear, I can't spell this for crap) can now be morphed
      from other sidearm-styled swords; the arming sword and messer, specifically.
  - qol: Knight's Armets are no longer proportioned like bobbleheads (my bad for that
      in the first place), and should now be more properly fitting to shorter races
      in particular.
  - bugfix: Burgonets and Blacksteel Plate Helmets now properly use the right detail
      sprites (and listings in the .dmis).
  - rscadd: Open-faced variant of the Burgonet, transformable from a Sallet.
  - bugfix: Bronze chainmail and lamellar now has bronze-tier protection, instead
      of mistakingly inheriting the protection levels from their up-path counterparts.
  - bugfix: Wearing a plated ordinator coat as a Psydonian now applies the Psydonic
      Grit active event, as it normally would with the standalone variant.
  - code_imp: Minor rearranging of hauberk-related wordings.
  ToasterStrudes:
  - rscadd: 'Added new mixed drinks: The Etrusso and Milk Tea - Made by combining
      milk and coffee/tea together'
  WeNeedMorePhoron:
