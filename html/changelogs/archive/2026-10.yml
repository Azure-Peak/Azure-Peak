      noticed it was a thing until now.
  Ollanius:
  - bugfix: Kaskaras, Ngmobes, and other reskins should no longer print an error icon
      when wielded (in cases where it's been specifically applied to Arming Swords).
  - rscadd: Anointed weaponry. Obtainable by only the Cleric, these cold iron weapons
      deal less damage but have higher defense and integrity. While they cannot sunder
      greater villains (in PVP), the lesser blessings nevertheless allow them to smite
      lesser evils (in PVE). Thanks to Radarseas for the underlying mechanical work!
  - balance: The Cleric can now select from one of several anointed weapons, if the
      "Crusader" loadout option is chosen. Note that they lose the free Silver Order
      surcoat.
  - bugfix: Anointed spears no longer have an errant typo in the .dmis, allowing for
      their wielded sprite to properly render.
  - bugfix: Kaltzbegers, when used for an Arming Sword's reskin, no longer vanish
      when two-handed.
  - code_imp: Note - for donor reskins (and not just full-on different weapons), the
      variable still checks for a '...1' at the end for a wielded sprite. Even if
      it's based on a weapon that already autogenerates a wielded sprite based on
      a single instance, not including a second icon with the aformentioned '...1'
      will cause it to freak out.
