  ShadowLarkens:
  - code_imp: The /filter system has been updated to /tg/ latest, this may cause weird
      visual issues with anything that uses filters, please report anything you see!
  - admin: View Variables now has a dark mode, enabled by default. To disable it,
      go to Game Preferences -> View Variables Theme
  - admin: View Variables has had support for newer types such as appearances, bitflags,
      colors, filters, matricies, special lists, and weakrefs MASSIVELY improved.
  - admin: View Variables can now -tag- datums; this is like marking them, but you
      can have many tagged datums, and they all show up in a list accessed through
      Verbs, Admin -> Admin -> Tagged Datums
  - admin: View Variables' dropdown options now tell you which type they came from,
      so you can see what options are applicable to atoms, movables, mobs, etc.
  - admin: View Variables' dropdown options now includes an expanded suite of tools!
  - admin: View Variables -> Remove & Mass Remove Component does as you'd think
  - admin: View Variables -> Edit Color as Matrix allows you to customize the color
      matrix of an atom to do advanced tinting.
  - admin: View Variables -> Edit Filters allows you to make custom filters to massively
      fuck with an atom's appearance.
  - admin: View Variables -> Download Sprite allows you to download something's sprite
      as a png.
  - admin: View Variables -> Test Matricies allows you to interactively fuck around
      with scaling/shearing/rotating atoms using their transform matrix.
  - admin: View Variables -> Edit Particles allows you to play with BYOND's particle
      system; make rain, piss laser beams, whatever!
  - admin: View Variables -> Debug Appearance! This is extremely exciting for developers;
      it allows you to view the entire chain of overlays comprising a single atom's
      apperance, so no more guess work for why a pixel is out of place in the human
      icon rendering stack! You can filter by planes, there's a live view of each
      overlay, lists of details so dense you'll have to chew on them!!
