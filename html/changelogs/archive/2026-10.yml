2026-10-04:
  KatTheFox:
  - rscadd: You can now set an 'artist credit' and 'artist link' for your headshot.
      The artist credit will be displayed in a box beneath your headshot on examine,
      if set; if the link is set too, the box will be clickable. Use this for linking
      to an artist's portfolio/donation page/etc.
  - bugfix: Inq/church folks no longer get notified twice that someone's their ally
      when examining them.
  OrbisAnima:
  - code_imp: Fixes a runtime with leeches checking for the wrong user trait.
  - code_imp: Fixes a runtime with goblin underwear when they were being deleted.
  - code_imp: Fixes a runtime with TRAIT_SKILLBLESSED, there might be still an underlying
      issue to check with cases with two things that give that, so future checks are
      needed on it.
  - code_imp: Fixes a runtime with hostile mobs changing targets and registering two
      or more signals. I just told the thing to STFU and stop doing the loop and stack
      trace, taking the new thing they got, but its likely we want that checked on
      more detail.
  - code_imp: Fixed archers going to fetch their arrows and moving to them instead
      of runtiming when people arent around. They still dont pick their arrows but
      thats out of scope.
  - code_imp: Fixes a non runtime bug when using adjust or set hydration for traitnohunger
      mobs, that was editing their nutrition instead of hydration, likely a copy paste
      issue.
  - code_imp: Fixes a runtime when a looping sound has no one to hear. The answer
      to what sound makes a tree falling in the forest when no one is around is no
      longer a runtime.
  - code_imp: Fixes a runtime with Dullahan's head checks on player interactions panel.
  - code_imp: Fixes a runtime with hobgoblins underwear when they were being deleted.
      Should had seen that one coming.
  - code_imp: Fixes a runtime with dust on drop items that were trying to be qdeleted
      when death already was qdeleting them, placed a guard so they dont get deleted
      if they are already deleted.
  - code_imp: Fixes a runtime with stakes trying to move a victim that is not there.
