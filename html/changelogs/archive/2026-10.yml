  OrbisAnima:
  - code_imp: Fixes a runtime with leeches checking for the wrong user trait.
  - code_imp: Fixes a runtime with goblin underwear when they were being deleted.
  - code_imp: Fixes a runtime with TRAIT_SKILLBLESSED, there might be still an underlying
      issue to check with cases with two things that give that, so future checks are
      needed on it.
  - code_imp: Fixes a runtime with hostile mobs changing targets and registering two
      or more signals. I just told the thing to STFU and stop doing the loop and stack
      trace, taking the new thing they got, but its likely we want that checked on
