      by a few tiles + smokeshield.
  - balance: you can no longer bleed people out by nuking people w/ your ERP related
      organs on top of regular ones by exploding via calcic as a wretch skeleton,
      literally 1984.
2026-10-07:
  Dorodomki:
  - rscadd: Added a new belt with loincloth
