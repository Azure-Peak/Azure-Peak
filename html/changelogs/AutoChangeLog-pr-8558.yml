author: "KatTheFox"
delete-after: True
changes:
  - bugfix: "Fixed a bug where flying mobs would lose their flight after climbing."
  - bugfix: "Fixed an exploit allowing several skills, most notably alchemy, to be infinitely levelled without regard for level caps or even a need to sleep and spend dream points. Added safeguards against more variants of the exploit being added."
  - bugfix: "The Paladin adventurer class no longer lies to you about its choices; specifically, the unique sword it gets now properly applies its intended effect of being \"pve-only silver\". It only works on mindless NPCs, and is otherwise mechanically identical to a normal longsword. Also, the class preview text now properly explains what each of the choices entails."
  - bugfix: "Familiar ooc notes are no longer double-sanitized, leading to html tags being displayed to the user."
  - bugfix: "Setting only one of (ooc notes|flavortext) on a familiar character will no longer display the text \"null\" to any viewers that open the examine window; instead, the field that's left blank will simply be... blank. How intuitive."
  - bugfix: "All bard melodies now send a message in chat when cast - some of them were completely silent, before."
  - bugfix: "All bard melodies now properly include the caster's name in their emote, instead of simply putting \"plays an xyz melody!\" in your chatbox and refusing to elaborate."
  - bugfix: "The recipe for salo no longer accepts salo as an input, it needs regular fat; this means if you try to craft it in bulk, it'll no longer consume itself."
  - bugfix: "Amulets and psycrosses will no longer skip several checks when being equipped, meaning - among other things - familiars and wildshaped mobs cannot psyexplode themselves."
  - bugfix: "Fixed an issue where characters with traits that prevent vomiting - such as vampires and deadites - could become eternally nauseous by drinking blood."