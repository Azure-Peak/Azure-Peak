author: "radarseas"
delete-after: True
changes:
  - rscadd: "Added ancient longsword, its an artificed Gilbranze longsword that loses some offensive potental in exchange for a little bit more durability and defense. - Its currently not craftable and doesn't have an ancient varient (yet)."
  - code_imp: "added trait_skeletal_gib_on_death, a non-user facing trait that gibs you w/ the same sound effects as skeles."
  - rscadd: "skeletons make a bit more noise on dying apart from just the gib noises."
  - rscadd: "skeletons/deadites can now taunt w/ RMB and no weaponry, w/ the middle finger taunt against non-deathless people so you can RAGE AGAINST THE LYVING!"
  - balance: "unbound deathknight + spellblade + lich spellblade recieved the ancient longsword."
  - balance: "unbound skeletons + siege skeletons gib on death now."
  - balance: "steel sabre removed from unbound spellblade's choices, replaced w/ longsword."
  - balance: "death knights recieved a gorget + arming cap + 1str to make up for the balance nerfs so they're slightly more durable."
  - balance: "death knights can now pick flail + shield."
  - balance: "death knights have journeyman knives + flails, their riding was knocked down from journeyman -> apprentice. Their wresting was knocked down from expert (why?) to Journeyman."
  - rscadd: "unimplimented vhelsynites now do the middle finger taunt like averse people."
  - rscdel: "Removed the old death longsword, it never displayed properly inhand."
  - bugfix: "fixed unbounds having swift intent, they only have 4 intents like every other skeleton now."
  - bugfix: "unbound skeletons were getting simplemob claw intent, they now get proper clawing instead of being completely harmless without a weapon, save for having to somehow pin and choke you to death."