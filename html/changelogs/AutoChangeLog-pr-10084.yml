author: "WeNeedMorePhoron"
delete-after: True
changes:
  - balance: "Made blockade slightly cheaper to issue, same for Incursion"
  - balance: "Blockade handle 8 instead of 6 bands of threats"
  - balance: "Increased definition of highpop from 30 to 60"
  - balance: "Implemented scaling, such that with a Steward or Innkeeper, at roundstart the amount of contracts available would be similar to before I buffed it by 2x, trending toward more quests at 1:30"
  - balance: "Contracts is now distributed to the regions with the most proportional threat"
  - rscadd: "Optimized the contract ledger by caching things like threat points, size table, rewards, text and moving some into static data. The amount of cpu it was using crept up steadily as I added feature so this should bring it back down"
  - rscadd: "Added subfactions for various factions"
  - rscadd: "Notorious Bounties can now be taken solo, designed as a 1v1, scaled as a 1v1, and you are recommended to bring two regardless"