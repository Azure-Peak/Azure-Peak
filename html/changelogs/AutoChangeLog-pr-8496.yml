author: "WeNeedMorePhoron"
delete-after: True
changes:
  - rscadd: "Added support for summon spell to replace summon one at a time or fully at capacity. Such a replacement will inflict a partial recoil based on how heavily damaged the summon is."
  - rscadd: "Zizo Cleric's Raise Lesser Skeleton spell now replace its summons one at a time."
  - rscadd: "Resolved an issue where summoned undead don't attack other undead, because of a shared \"Skeleton_faction\" because they were all named Skeleton. Note that this doesn't applies to Zizo's other miracles, which has not moved onto the new system and I am not touching to not dip myself into balance discussions"
  - bugfix: "Lesser Fetch and Repel can no longer move anchored object or objects meant to resist moving. No more navigator fetching."
  - bugfix: "Lesser Fetch / Repel has been renamed and refactored, removing the old fetch / repel and any instances of their projectile being referenced. They are now Fetch / Repel."
  - bugfix: "Obsolete unused Vanderlin alchemy runes code has been removed"
  - rscdel: "Deep one no longer yeet the old fetch projectiles at you."