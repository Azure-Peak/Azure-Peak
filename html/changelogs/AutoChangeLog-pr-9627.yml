author: "WeNeedMorePhoron"
delete-after: True
changes:
  - rscadd: "Ported 8 additional towner expanded quest by SatinIsles from our downstream Ochre Valley. Enjoy!"
  - rscadd: "Notorious Contract's default timer is now 15 instead of 20 minutes, and will now count the entire party going unconscious as a victory for the target"
  - rscadd: "Towner quests can now be turned in at the nearest HERMES by putting the package in it, allowing the towner to open it at their own leisure and making it way less troublesome for both party."
  - rscadd: "Refactored the entirety of the contract system, report any oddities"
  - rscadd: "Failing a contract now forfeits your deposit"
  - rscadd: "Smith Caravan can now spawn in Azure Grove"
  - rscadd: "Deposits are only returned if actually paid"
  - rscadd: "Contract issuers can no longer cash in their own contract"
  - rscadd: "A \"Your Postings\" tab now exists in the ledger in the bottom, replacing the Steward / Innkeeper's special tab, where you can withdraw contracts"
  - rscadd: "Contracts withdrawn before it is taken will refund fully, contracts withdrawn when someone failed it or it is taken will refunds partially. Contract partially refunds on failure."
  - rscadd: "Towner may issue up to 5 contracts simultaneously."
  - rscadd: "Added 30 minutes timer for delivery post killing of guardians in Towner quests so it cannot be stalled forever."
  - rscadd: "Ported SatinIsles' GM quests system from Ochre and integrated it into the Game Master panel, GM can now issue special kill and recovery quests"