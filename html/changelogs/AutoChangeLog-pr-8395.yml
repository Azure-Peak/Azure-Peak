author: "KatTheFox"
delete-after: True
changes:
  - code_imp: "Familiars are now humanmobs, instead of simplemobs. This vaguely means they'll be able to interact with more things like you'd expect, but might also induce some wyrd bugs - report any broken interactions."
  - rscadd: "The familiar preferences window has been touched up; it now displays one plane's settings as a time and can be cycled. Familiars can now also set their voice color."
  - bugfix: "Fae familiars no longer get misleading tutorial text; it's been updated to match their new ability tiering. Their spell descriptions have also been updated to clarify their mechanics."
  - bugfix: "Fae familiars can now remove reagents from themselves, and can drink (and be fed) from containers as intended. Reagent bite also now works to fill and empty containers, and says as much in its description."
  - bugfix: "Familiars can now wear neck items like pouches and amulets on their neck. For real this time, we promise."
  - bugfix: "The \"globally disable the panel for this type of mob\" variable now actually... works on both ends, instead of only being checked for the initiator."
  - bugfix: "Origin lore examines are now cached at roundstart, so they don't display incorrectly in certain cases, and will work while you're AFK."