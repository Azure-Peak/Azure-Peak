author: "WeNeedMorePhoron"
delete-after: True
changes:
  - rscadd: "Price of market goods are measured in a decimal manner. This let me price goods much more precisely. Any coins that is withdrawn must still be whole."
  - rscadd: "The market (Stockpile machine) is now separated conceptually from royal stock, with nine price band for goods. Selling price is the baseline, and buying price is 75% of the current buying price."
  - rscadd: "Keep roles with Royal Subsidy now deposit into the royal stockpile unpaid."
  - rscadd: "The Steward now buy from and sell from the market with treasury money."
  - rscadd: "The market sells past zero down to half the target, and then runs out of stock. In short, it is a relatively elastic market."
  - rscadd: "Market targets are set per category, with certain bulk goods getting more goods."
  - rscadd: "Market Dae: Every dawn, market stock moves toward the target by 50% of the gap, with a floor of 25% of the target."
  - rscadd: "Raids / Blockade cut the step by the raided share of supply or demand."
  - rscadd: "Rented Caravans (see below) pay 50m and adds 10% to market correction each. Over 100%, a midday correction will also occurs"
  - rscadd: "Market tab / Stockpile show a forecast with a RAIDED % tag"
  - rscadd: "Royal Stock starts off completely empty. Royal Subsidy is now gated by the wages for tomorrow, which completely replaces the purchase floor"
  - rscadd: "Built in all of the new Azurian lore regions. They all are built from a composition of region types x size. Regions belongs to one of the 4 bigger regions and 8 subroutes."
  - rscadd: "Requests now replace Standing Orders. It will requests one type of good, one equipment or potion item."
  - rscadd: "Each region has up to one request and one offer."
  - rscadd: "4 requests roll a day plus 0.05 per player, capped at 13, each lasting 2 dayss."
  - rscadd: "Each is worth 200 - 400m (pop scaling) and pay at 2.5x. Delivery is per unit and can be partial, quality will influence and increase pay where eligible. There is no more low-pop bonus since Steward has ability to call in Tributes which add flat value to the economy."
  - rscadd: "Extending a Request: You can extend a request for 1 day by sending a zad for 200 pledge."
  - rscadd: "Petitions: The Steward's petitions are reworked. They are picked by kinds, and then target a random eligible regions, including raided regions. It cost pledge and the order will pay less."
  - rscadd: "Requests for crafted goods pay more, but it must be crafted by a player."
  - rscadd: "The Steward will start with 5 caravans, and +1 caravan per day, up to 12. Each will carries 1 request, 1 offer and 1 tribute on a route. It is committed when it is sent and then the trade is settled at dawn."
  - rscadd: "Tribute: Tribute are hand set goods that a region will gift. They are worth 150m, and then pop scaled and sent toward the Royal Stock. They are also used for nobility"
  - rscadd: "Gifts: A random gift is sent per every pickup from region, toward the warehouse. They have the new gift quality and 0% value"
  - rscadd: "Raids: Raids will block a subroute. The escort fee is 200m + 100m / day. It opens the subroute for deals and market dae. Raided deals are half size"
  - rscadd: "Commissions: Crown Imports are removed in favor of the new Commission system. Retinue kits come from the Royal Armoury (Abstracted), and is priced at 1.5x their goldface / silverface price and come on a timer. The local commsision will sell keyring set and zad packs"
  - rscadd: "Regional events are scrapped. There is a pool of 42 daily gluts and shortages events: Fish and Crops, Primary Goods, Secondary Goods and Cosmetic / Trade Goods. Every day two fish or crop related events will be active, pus one or two others. Only one metal related event can be active at a time, and some events are mixed causing some gluts and shortages. The primary emphasis is on fish / crops related events because these are the two economic roles that can adapt the most and  change their production. I have limited the relative impact of metal events. Shortage relief is now counted by value sold into the market."
  - rscadd: "You can pick your political faction in the new Politics tab. This includes the Neutral, Azurosa, Heartfelt, Rosawood, Benedictus (Psydonites Only). Your political faction is visible to other of the same factions, unless you're a noble, in which case your faction is always visible. Inquisition is always Benedictus and Merchant always Rosawood. Outlaws are disowned. A new ruler's faction is announced as ascendant."
  - rscadd: " You can pick the location of your estates (Only applied if you're a noble by job or role) from one of the 17 regions of Azuria, landless, or foreign estate. You lose the parcel if the region is blockaded and the income is delayed until it is cleared. Foreign estates pay 1/3 less in terms of parcel and income."
  - rscadd: "Nobility are split into three ranks: Gentries gain 15m of income plus one parcel of the region's tribute goods. Peer gains 30m and 2 parcels, and royal 50m + 3 parcels (Excluding Grand Duke). Heartfelt Lord is ranked as a Peer but paid as a Royal. Everyone will see a noble's rank."
  - rscadd: "Knight Banneret now speaks Old Azurian, and has a new verb called Remember Title. This show the ruler's full styling plus the old Azurian version. It can be swapped per map. There's no support / featuire for it, yet."
  - rscadd: "Every single Nerve Master interface has been moved to TGUI and improved greatly in readability and usability. Performance improved. Printed reports were removed"
  - rscdel: "Direct import, export, autoexport, steward trade policies, stockpile limits, export ledger. Alderman trade controls, etc."
  - rscadd: "Rewritten accords / laws to fit the newest lore as much as possible"
  - rscadd: "Redid the mail system to no longer depends on a singular 10x10 inventory"
  - rscadd: "Stockpile items can no longer be directly exported or sold to ships, except by the Merchant / Shophand who will have an export license to remove the stockpile stamp from these goods for sale."